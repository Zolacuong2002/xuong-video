<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>short</title>
<style>
/*THUONG_HIEU*/

/* Khung dọc 1080×1920 dùng chung YouTube Shorts + TikTok. Tranh phủ toàn màn hình, chữ nằm trong vùng an toàn
   của CẢ HAI: TikTok che ~150px trên (tab Đang theo dõi/Dành cho bạn), YouTube che ~250px dưới (tiêu đề, kênh),
   cả hai che ~180px mép phải (nút like/share) → khối chữ trên bắt đầu từ 176px, phụ đề chạy nằm ở ~1250–1360.
   Lời đọc chạy theo phụ đề ASS (bước 10 ghép bằng ffmpeg), lớp này chỉ có: nhãn kênh + tiêu đề đoạn. */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;color:var(--muc);font-family:var(--chu)}
body{position:relative;background:var(--nen)}
body.lop-phu{background:transparent}
.tranh{position:absolute;inset:0;z-index:0}
.tranh img{width:100%;height:100%;object-fit:cover;display:block}
body.lop-phu .tranh{display:none}

/* dải mờ trên (nhãn + tiêu đề) và dưới (chỗ phụ đề chạy) để chữ trắng đọc được trên mọi tranh */
.dai-tren{position:absolute;left:0;right:0;top:0;height:640px;z-index:1;
  background:linear-gradient(to bottom, rgba(15,23,32,.82) 0%, rgba(15,23,32,.55) 45%, transparent 100%)}
.dai-duoi{position:absolute;left:0;right:0;bottom:0;height:900px;z-index:1;
  background:linear-gradient(to top, rgba(15,23,32,.92) 0%, rgba(15,23,32,.6) 40%, transparent 100%)}

.kenh{position:absolute;left:64px;top:176px;z-index:2;display:inline-flex;align-items:center;gap:14px;
  padding:14px 30px 15px;border-radius:999px;background:rgba(22,33,44,.72);border:1.5px solid rgba(255,255,255,.18);
  font-size:32px;font-weight:600;color:#EEF2F6;backdrop-filter:blur(6px)}
.kenh::before{content:"⚙";color:var(--nhan);font-size:32px}
.kenh::after{content:var(--ten-kenh)}

.tieu{position:absolute;left:64px;right:120px;top:284px;z-index:2;text-shadow:0 3px 14px rgba(0,0,0,.6)}
.tieu .thanh{width:72px;height:8px;border-radius:4px;background:var(--nhan);margin-bottom:22px}
.tieu h1{font-size:76px;font-weight:800;line-height:1.1;letter-spacing:-.02em;text-wrap:pretty;max-width:900px}
.tieu h1 b{color:var(--nhan);font-weight:800}
.tieu .phu{margin-top:18px;font-size:38px;color:#D3DBE4;line-height:1.3;max-width:860px}

/* đoạn cuối: nút kêu gọi nằm ngay dưới tiêu đề (vùng dưới dành cho phụ đề chạy theo lời) */
.goi{margin-top:30px;display:inline-flex;align-items:center;gap:18px;
  background:var(--nhan);color:#1A1205;font-size:40px;font-weight:700;padding:22px 40px;border-radius:999px;
  box-shadow:0 14px 40px rgba(0,0,0,.4);text-shadow:none}
</style>
</head>
<body>
<script id="du-lieu" type="application/json">__DU_LIEU__</script>
<div id="goc"></div>
<script>
(function(){
  var D = JSON.parse(document.getElementById("du-lieu").textContent);
  if (D.lop_phu) document.body.classList.add("lop-phu");
  function e(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  // tô cam cụm D.nhan nếu nó nằm trong tiêu đề
  function toNhan(t, nhan){
    var s = e(t);
    if (nhan && t.indexOf(nhan) >= 0) s = s.replace(e(nhan), "<b>" + e(nhan) + "</b>");
    return s;
  }
  var html = "";
  if (!D.lop_phu && D.anh) html += '<div class="tranh"><img src="' + e(D.anh) + '" alt=""></div>';
  html += '<div class="dai-tren"></div><div class="dai-duoi"></div>';
  html += '<div class="kenh"></div>';
  html += '<div class="tieu"><div class="thanh"></div><h1>' + toNhan(D.tieu_de || "", D.nhan) + '</h1>' +
          (D.phu ? '<p class="phu">' + e(D.phu) + '</p>' : '') +
          (D.goi ? '<div class="goi">' + e(D.goi) + ' →</div>' : '') + '</div>';
  document.getElementById("goc").innerHTML = html;
})();
</script>
</body>
</html>
