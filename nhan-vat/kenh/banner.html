<!doctype html><html lang="vi"><head><meta charset="utf-8"><style>
/*THUONG_HIEU*/
*{margin:0;padding:0;box-sizing:border-box}
/* Khổ YouTube: 2560×1440. Vùng AN TOÀN hiện trên mọi thiết bị: 1546×423 ở chính giữa.
   Mọi chữ và mặt nhân vật phải nằm trong vùng đó; phần ngoài chỉ là nền. */
html,body{width:2560px;height:1440px;overflow:hidden;background:var(--nen);font-family:var(--chu);color:var(--muc)}
body{position:relative}
body::before{content:"";position:absolute;inset:0;background:
  radial-gradient(1400px 900px at 78% 50%, var(--nhan-nen), transparent 62%),
  radial-gradient(1100px 700px at 12% 90%, rgba(56,189,248,.07), transparent 60%)}
.an-toan{position:absolute;left:507px;top:508px;width:1546px;height:423px;display:grid;grid-template-columns:1fr 470px;align-items:center;gap:40px}
.chu{display:flex;flex-direction:column;justify-content:center;padding-left:24px}
.thanh{width:96px;height:10px;background:var(--nhan);border-radius:5px;margin-bottom:26px}
h1{font-size:132px;font-weight:900;line-height:.95;letter-spacing:-.035em;text-transform:uppercase}
h1 b{color:var(--nhan)}
p{margin-top:24px;font-size:36px;color:var(--muc-mo);line-height:1.3;max-width:900px}
.nv{position:relative;height:423px;width:470px;display:grid;place-items:center}
.vong{position:relative;width:400px;height:400px;border-radius:50%;overflow:hidden;
  background:radial-gradient(circle at 50% 42%, #FFF3DC 0%, #FFE2B0 55%, var(--nhan) 56%);
  box-shadow:0 0 0 6px var(--nen), 0 0 0 9px var(--nhan)}
.vong img{position:absolute;left:50%;top:-4%;width:118%;height:auto;transform:translateX(-50%);mix-blend-mode:multiply}
</style></head><body>
<div class="an-toan">
  <!-- Sửa hai dòng dưới: tên kênh (chữ trong <b> tô màu nhấn) và câu mô tả -->
  <div class="chu"><div class="thanh"></div><h1>Tên <b>kênh</b></h1>
  <p>Một câu nói kênh này làm gì cho ai.</p></div>
  <div class="nv"><div class="vong"><img src="../chuan/nhan-vat-goc-mat.jpg" alt=""></div></div>
</div>
</body></html>
